<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Close Rail Insights?</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#203342;font:14px 'Segoe UI',sans-serif;border:1px solid #bac8d2;height:100vh;display:flex;flex-direction:column}
header{height:43px;flex-shrink:0;background:#203746;color:#e8eff4;display:flex;align-items:center;justify-content:space-between;padding-left:20px;font-size:11px;font-weight:600;letter-spacing:1.2px;-webkit-app-region:drag}
button{font:600 13px 'Segoe UI',sans-serif;cursor:pointer;-webkit-app-region:no-drag}header button{height:42px;width:44px;border:0;background:transparent;color:#e8eff4;font-size:23px;font-weight:400}header button:hover{background:#9a3434}
main{padding:25px 26px 22px;flex:1}h1{font-size:21px;letter-spacing:-.4px;line-height:1.3;margin:0 0 12px;font-weight:600}p{margin:0;color:#536573;line-height:1.55;font-size:13px}.warning{display:flex;gap:12px;margin-top:19px;padding:12px 14px;background:#fff7e5;border:1px solid #e7d3a4;border-left:3px solid #bc8728;border-radius:3px;color:#77541d}.warning svg{flex-shrink:0;margin-top:1px}.warning strong{display:block;font-size:12px;font-weight:600}.warning span{display:block;font-size:12px;margin-top:3px;line-height:1.4}
footer{display:flex;justify-content:flex-end;gap:10px;padding:15px 26px;background:#eaf0f4;border-top:1px solid #cdd7df}footer button{min-height:36px;padding:0 16px;border-radius:4px;border:1px solid #aebec9;background:#fff;color:#284254}footer button:hover{background:#f0f5f8}.danger{background:#973c36;color:#fff;border-color:#973c36}.danger:hover{background:#7f302c}button:focus-visible{outline:2px solid #247392;outline-offset:3px}
</style>
</head>
<body>
<header><span>RAIL INSIGHTS / EXIT</span><button id="dismiss" aria-label="Cancel closing">×</button></header>
<main aria-labelledby="heading">
<h1 id="heading">Close the workspace?</h1>
<p>A study may still be running. Closing Rail Insights will stop the local analysis engine.</p>
<div class="warning"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 3 2 21h20L12 3Z"/><path d="M12 9v5m0 3v1"/></svg><div><strong>Unfinished analysis will be interrupted</strong><span>Keep the workspace open to let your study finish.</span></div></div>
</main>
<footer><button id="keep" autofocus>Keep open</button><button id="stop" class="danger">Stop engine &amp; close</button></footer>
<script src="close-confirmation.js"></script>
</body>
</html>
